name: Auto Prerelease Build

on:
  push:
    branches:
      - master

jobs:
  build-prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mod Jar
        run: ./gradlew build

      - name: Create or Update GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-dev
          name: "Development Prerelease"
          body: "Automated pre-release build from the latest commit."
          prerelease: true
          files: build/libs/1(*-sources).jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
